<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Verdana, sans-serif">
  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#222">Wireframe 3 — My Results Page (low-fidelity)</text>
  <text x="40" y="68" font-size="13" fill="#555">Results are the #1 reason students open the portal in result season — so they get their own page, one click from the dashboard.</text>

  <rect x="40" y="90" width="1120" height="640" fill="#fafafa" stroke="#666" stroke-width="2"/>
  <rect x="40" y="90" width="1120" height="60" fill="#dfe7f2" stroke="#666"/>
  <rect x="60" y="102" width="36" height="36" fill="#fff" stroke="#666"/>
  <text x="66" y="126" font-size="11" fill="#333">UAF</text>
  <text x="110" y="127" font-size="16" font-weight="bold" fill="#222">Student Portal</text>
  <text x="900" y="127" font-size="13" fill="#333">Areeba (2023-ag-1234) ▾   Log out</text>

  <text x="70" y="196" font-size="13" fill="#0645ad">← Back to Dashboard</text>
  <text x="70" y="232" font-size="20" font-weight="bold" fill="#222">My Results</text>

  <!-- Semester selector -->
  <text x="70" y="272" font-size="14" fill="#222">Semester:</text>
  <rect x="160" y="252" width="260" height="36" fill="#fff" stroke="#666"/>
  <text x="172" y="276" font-size="13" fill="#333">Semester 4 — Spring 2026 ▾</text>
  <rect x="440" y="252" width="190" height="36" fill="#2f5597"/>
  <text x="470" y="276" font-size="13" fill="#fff">⬇ Download PDF</text>

  <!-- Summary strip -->
  <rect x="70" y="308" width="1060" height="58" fill="#eaf3ea" stroke="#666"/>
  <text x="86" y="344" font-size="15" fill="#222">Semester GPA: <tspan font-weight="bold">3.42</tspan> · CGPA: <tspan font-weight="bold">3.35</tspan> · Credit hours: 18 · Status: <tspan font-weight="bold">Promoted</tspan></text>

  <!-- Results table -->
  <rect x="70" y="386" width="1060" height="252" fill="#ffffff" stroke="#666"/>
  <rect x="70" y="386" width="1060" height="40" fill="#e8e8e8" stroke="#666"/>
  <text x="86" y="412" font-size="13" font-weight="bold" fill="#222">Course</text>
  <text x="480" y="412" font-size="13" font-weight="bold" fill="#222">Mid</text>
  <text x="580" y="412" font-size="13" font-weight="bold" fill="#222">Final</text>
  <text x="680" y="412" font-size="13" font-weight="bold" fill="#222">Total</text>
  <text x="790" y="412" font-size="13" font-weight="bold" fill="#222">Grade</text>
  <text x="900" y="412" font-size="13" font-weight="bold" fill="#222">Status</text>
  <g font-size="13" fill="#333">
    <text x="86" y="452">CS-601 Human Computer Interaction</text><text x="480" y="452">24/30</text><text x="580" y="452">52/70</text><text x="680" y="452">76</text><text x="790" y="452">B+</text><text x="900" y="452" fill="#1e7a1e">Published</text>
    <text x="86" y="492">CS-301 Data Structures</text><text x="480" y="492">27/30</text><text x="580" y="492">—</text><text x="680" y="492">—</text><text x="790" y="492">—</text><text x="900" y="492" fill="#b58900">Final pending</text>
    <text x="86" y="532">MTH-301 Statistics</text><text x="480" y="532">21/30</text><text x="580" y="532">48/70</text><text x="680" y="532">69</text><text x="790" y="532">B</text><text x="900" y="532" fill="#1e7a1e">Published</text>
    <text x="86" y="572">ENG-301 Technical Writing</text><text x="480" y="572">26/30</text><text x="580" y="572">55/70</text><text x="680" y="572">81</text><text x="790" y="572">A</text><text x="900" y="572" fill="#1e7a1e">Published</text>
  </g>
  <line x1="70" y1="466" x2="1130" y2="466" stroke="#ccc"/>
  <line x1="70" y1="506" x2="1130" y2="506" stroke="#ccc"/>
  <line x1="70" y1="546" x2="1130" y2="546" stroke="#ccc"/>
  <line x1="70" y1="586" x2="1130" y2="586" stroke="#ccc"/>
  <text x="86" y="622" font-size="12" fill="#555">Pending subjects say "Final pending" in words — never a blank or a silent zero (visibility of system status).</text>

  <rect x="70" y="656" width="1060" height="52" fill="#fff4d6" stroke="#b58900"/>
  <text x="86" y="688" font-size="13" fill="#664d00">Something wrong with a result? → "Report a discrepancy" button opens a form to the exam section (help &amp; error recovery).</text>

  <text x="40" y="762" font-size="12" fill="#555">Fixes from the evaluation: results findable in 1 click · status always visible · plain-language labels · printable PDF for the student's record.</text>
  <text x="40" y="784" font-size="12" fill="#555">During result entry this page shows "Results are being entered — back Fri 5 pm" instead of blocking the whole portal (fixes Flaw 1).</text>
</svg>
