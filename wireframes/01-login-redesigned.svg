<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Verdana, sans-serif">
  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#222">Wireframe 1 — Redesigned UAF Student Portal Login (low-fidelity)</text>
  <text x="40" y="68" font-size="13" fill="#555">One page, one task: log in. Result lookup and notices are separated and written in plain language.</text>

  <!-- Browser chrome -->
  <rect x="40" y="90" width="1120" height="640" fill="#fafafa" stroke="#666" stroke-width="2"/>
  <rect x="40" y="90" width="1120" height="44" fill="#e8e8e8" stroke="#666"/>
  <circle cx="66" cy="112" r="8" fill="#bbb"/><circle cx="92" cy="112" r="8" fill="#bbb"/><circle cx="118" cy="112" r="8" fill="#bbb"/>
  <rect x="150" y="100" width="700" height="24" fill="#fff" stroke="#999"/>
  <text x="160" y="117" font-size="12" fill="#333">🔒 https://lms.uaf.edu.pk/login  — HTTPS, padlock visible (fixes Flaw 5)</text>

  <!-- Header -->
  <rect x="40" y="134" width="1120" height="64" fill="#dfe7f2" stroke="#666"/>
  <rect x="60" y="148" width="36" height="36" fill="#fff" stroke="#666"/>
  <text x="66" y="172" font-size="11" fill="#333">UAF</text>
  <text x="110" y="172" font-size="17" font-weight="bold" fill="#222">University of Agriculture Faisalabad — Student Portal</text>
  <text x="1010" y="172" font-size="13" fill="#333">اردو | Help</text>

  <!-- Notice bar (only when needed, with dates) -->
  <rect x="290" y="222" width="620" height="52" fill="#fff4d6" stroke="#b58900"/>
  <text x="306" y="244" font-size="13" fill="#664d00">⚠ Notice (only shown when needed, always with dates — fixes Flaw 1):</text>
  <text x="306" y="264" font-size="13" fill="#664d00">"Result entry: Fri 20 Nov, 9 am – 5 pm. Courses stay open."</text>

  <!-- Login card -->
  <rect x="290" y="296" width="620" height="330" fill="#ffffff" stroke="#666" stroke-width="2"/>
  <text x="320" y="338" font-size="20" font-weight="bold" fill="#222">Student Login</text>
  <text x="320" y="362" font-size="13" fill="#555">Use your Registration No. (e.g. 2023-ag-1234) and password.</text>

  <text x="320" y="398" font-size="14" fill="#222">Registration No.</text>
  <rect x="320" y="406" width="560" height="42" fill="#fff" stroke="#666"/>
  <text x="332" y="433" font-size="13" fill="#999">2023-ag-____</text>

  <text x="320" y="478" font-size="14" fill="#222">Password</text>
  <rect x="320" y="486" width="560" height="42" fill="#fff" stroke="#666"/>
  <text x="332" y="513" font-size="13" fill="#999">••••••••</text>
  <text x="812" y="513" font-size="12" fill="#555">👁 Show</text>

  <text x="320" y="556" font-size="13" fill="#0645ad">Forgot password? (standard label, under the field — fixes Flaw 3)</text>
  <rect x="640" y="536" width="240" height="48" fill="#2f5597"/>
  <text x="712" y="566" font-size="16" fill="#ffffff">Log in</text>

  <text x="320" y="606" font-size="13" fill="#555">New student? Your account is created automatically — </text>
  <text x="320" y="624" font-size="13" fill="#0645ad">Activate it with an OTP on your mobile (fixes Flaw 6)</text>

  <!-- Separated second task -->
  <rect x="290" y="648" width="620" height="56" fill="#f2f2f2" stroke="#999" stroke-dasharray="6 4"/>
  <text x="306" y="682" font-size="13" fill="#333">Not enrolled yet? → <tspan fill="#0645ad">Check your entry-test result (separate page — fixes Flaw 2)</tspan></text>

  <text x="40" y="762" font-size="12" fill="#555">No cookie jargon anywhere (fixes Flaw 4): problems are explained in plain words only if they actually happen.</text>
  <text x="40" y="784" font-size="12" fill="#555">Minimum text size 13px, button height 48px — readable and tappable on a phone.</text>
</svg>
